telemetry:
  queue-capacity: ${TELEMETRY_QUEUE_CAPACITY:100}
  submit-timeout: ${TELEMETRY_SUBMIT_TIMEOUT:250ms}
  poll-interval: ${TELEMETRY_POLL_INTERVAL:150ms}
  shutdown-timeout: ${TELEMETRY_SHUTDOWN_TIMEOUT:1s}
  max-packet-age: ${TELEMETRY_MAX_PACKET_AGE:5m}
  future-clock-skew: ${TELEMETRY_FUTURE_CLOCK_SKEW:30s}

spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: TelemetryPipelineJava
    version: 1.0.0
