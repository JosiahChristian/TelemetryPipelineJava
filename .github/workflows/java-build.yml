name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

  container-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag telemetry-pipeline-java:ci .

      - name: Inspect container user
        run: |
          test "$(docker image inspect telemetry-pipeline-java:ci --format '{{.Config.User}}')" = "telemetry"

      - name: Smoke test container health
        run: |
          docker run --detach --name telemetry-pipeline-ci -p 8080:8080 telemetry-pipeline-java:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/telemetry/health >/dev/null; then
              docker rm --force telemetry-pipeline-ci
              exit 0
            fi
            sleep 1
          done
          docker logs telemetry-pipeline-ci
          docker rm --force telemetry-pipeline-ci
          exit 1

  postgres-integration:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: telemetry
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry -d telemetry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test PostgreSQL profile
        env:
          SPRING_PROFILES_ACTIVE: postgres
          DATABASE_URL: jdbc:postgresql://localhost:5432/telemetry
          DATABASE_USERNAME: telemetry
          DATABASE_PASSWORD: telemetry
        run: mvn --batch-mode test
