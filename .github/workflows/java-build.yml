name: Enterprise Java Pipeline Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Java Development Kit (JDK 21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'

    - name: Compile Java Package Architecture
      run: javac src/com/telemetry/engine/Main.java -d bin

    - name: Execute Thread Safe Data Pipeline
      run: java -cp bin com.telemetry.engine.Main
