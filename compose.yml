services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - telemetry-postgres-data:/var/lib/postgresql/data

  application:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://database:5432/telemetry
      DATABASE_USERNAME: telemetry
      DATABASE_PASSWORD: telemetry
    ports:
      - "8080:8080"

volumes:
  telemetry-postgres-data:
